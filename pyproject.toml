# Outillage qualité du dépôt. Aucune dépendance de build : Slicer construit
# l'extension par CMake, ce fichier ne sert qu'aux outils de développement.

[tool.ruff]
line-length = 100
target-version = "py312"          # la version embarquée par Slicer 5.13
extend-exclude = ["**/__pycache__"]

# CLIQUET : on n'active que les règles que le dépôt passe aujourd'hui, pour que
# la CI soit verte dès le premier jour et le reste. Chaque règle du backlog
# ci-dessous s'active dans la branche qui corrige ses violations -- jamais en
# bloc, sinon la CI devient un bruit de fond qu'on apprend à ignorer.
[tool.ruff.lint]
select = [
  "E9",     # erreurs de syntaxe et d'exécution
  "F6",     # littéraux fautifs : clé de dictionnaire répétée, etc.
  "F7",     # break/continue/return hors de leur bloc
  "B002",   # ++x, qui ne fait rien
  "B012",   # break/return dans un finally, qui avale l'exception
  "B018",   # expression sans effet : le « f.close » sans parenthèses
  "PLE",    # erreurs pylint : arguments de logging, caractères invalides
  "F811",   # redéfinition silencieuse : la seconde écrase la première
  "F821",   # nom non défini : NameError garanti si la ligne est atteinte
]

# BACKLOG, dans l'ordre où il sera traité. Le compte date du 2026-09-16.
#   B006  (18) valeur par défaut mutable
#   B023   (4) fermeture capturant la variable de boucle -- change la sémantique, à traiter cas par cas
#   E722  (95) except nu
#   F401 (406) import inutilisé
#   E501 (3540) ligne trop longue -- à traiter par une passe de formatage, pas à la main

[tool.ruff.lint.per-file-ignores]
"*/Testing/*" = ["E501"]

# Trois noms non définis restent, tous parce que le module appelle du code qui
# vit dans la copie voisine du même fichier. Les corriger ici demanderait une
# quatrième copie ; ils tombent avec le partage de transformation.py et de
# ReadSurf dans ADTLib (P1-6 de l'audit), pas avant.
"ALI_IOS/ALI_IOS_utils/surface.py" = ["F821"]        # OFFReader, qui n'existe que dans ASO_IOS_utils
"FlexReg_CLI/FlexReg_Method/transformation.py" = ["F821"]  # TransformDict et TransformList, qui n'existent que dans AREG_IOS_utils
